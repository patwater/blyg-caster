services:
  mongodb:
    image: mongo@sha256:b415b12f638e2685d06c58ab7fb5943577c50fadec6d9340ef67d21aeac72070
  server:
    image: registry.gitlab.com/openid/conformance-suite@sha256:c795df1b151e0c2f2e40f17a2470991cc38bc91628449e9bb090e2372fe8b822
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      BASE_URL: https://localhost.emobix.co.uk:8443
      BASE_MTLS_URL: https://localhost.emobix.co.uk:8444
      MONGODB_HOST: mongodb
      SPRING_PROFILES_ACTIVE: dev
      OIDC_GOOGLE_CLIENTID: google-fixture
      OIDC_GOOGLE_SECRET: unused-fixture-secret
      OIDC_GITLAB_CLIENTID: gitlab-fixture
      OIDC_GITLAB_SECRET: unused-fixture-secret
    depends_on: [mongodb]
  nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx@sha256:607458218abb58204201e4d283af90177d6b542535a99a21041d399a1505a6a0
    ports: ["127.0.0.1:8443:8443"]
    networks:
      default:
        aliases: [localhost.emobix.co.uk]
    depends_on: [server]
